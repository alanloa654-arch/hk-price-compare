  <script>
(function () {
  "use strict";

  var STORE_LABEL = {
    WELLCOME: "惠康",
    PARKNSHOP: "百佳",
    JASONS: "Market Place",
    AEON: "AEON",
    WATSONS: "屈臣氏",
    MANNINGS: "萬寧",
    DCHFOOD: "大昌食品",
    LUNGFUNG: "龍豐",
    SASA: "莎莎"
  };

  var DEFAULT_STORES = ["WELLCOME", "PARKNSHOP", "JASONS", "AEON", "DCHFOOD"];
  var CARE_STORES = ["WATSONS", "MANNINGS", "SASA", "LUNGFUNG"];
  var ALL_STORE_ORDER = DEFAULT_STORES.concat(CARE_STORES);

  var PAGE = 50;
  var data = Array.isArray(window.PRICE_DATA) ? window.PRICE_DATA : [];
  var meta = window.PRICE_META || {};
  var selectedStores = {};
  ALL_STORE_ORDER.forEach(function (s) {
    selectedStores[s] = DEFAULT_STORES.indexOf(s) !== -1;
  });

  var state = {
    q: "",
    cat: "",
    sort: "cheap",
    limit: PAGE,
    openId: null
  };

  var el = {
    q: document.getElementById("q"),
    cat: document.getElementById("cat"),
    sort: document.getElementById("sort"),
    chips: document.getElementById("storeChips"),
    list: document.getElementById("list"),
    tips: document.getElementById("tips"),
    moreWrap: document.getElementById("moreWrap"),
    moreBtn: document.getElementById("moreBtn"),
    resultMeta: document.getElementById("resultMeta"),
    dataStamp: document.getElementById("dataStamp"),
    footerStamp: document.getElementById("footerStamp"),
    hktvBtn: document.getElementById("hktvBtn"),
    sticky: document.getElementById("stickyBar")
  };

  function zhStore(code) {
    return STORE_LABEL[code] || code;
  }

  function money(n) {
    if (typeof n !== "number" || !isFinite(n)) return "—";
    return "$" + (Math.round(n * 100) / 100).toFixed(2).replace(/\.00$/, "").replace(/(\.\d)0$/, "$1");
  }

  function debounce(fn, ms) {
    var t;
    return function () {
      var args = arguments;
      var self = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(self, args); }, ms);
    };
  }

  function buildCats() {
    var set = {};
    data.forEach(function (p) { if (p.c1) set[p.c1] = 1; });
    var cats = Object.keys(set).sort(function (a, b) { return a.localeCompare(b, "zh-Hant"); });
    var html = '<option value="">全部</option>';
    cats.forEach(function (c) {
      html += '<option value="' + escapeAttr(c) + '">' + escapeHtml(c) + "</option>";
    });
    el.cat.innerHTML = html;
    return cats;
  }

  function buildChips() {
    var html = "";
    ALL_STORE_ORDER.forEach(function (code) {
      var on = selectedStores[code];
      var care = CARE_STORES.indexOf(code) !== -1 ? " care" : "";
      html += '<button type="button" class="chip' + care + '" data-store="' + code + '" aria-pressed="' + (on ? "true" : "false") + '">' +
        escapeHtml(zhStore(code)) + "</button>";
    });
    el.chips.innerHTML = html;
  }

  function activeStoreCodes() {
    return ALL_STORE_ORDER.filter(function (s) { return selectedStores[s]; });
  }

  function offersMap(p) {
    var m = {};
    (p.o || []).forEach(function (o) { m[o.s] = o.t; });
    return m;
  }


  function zheToFactor(z) {
    var n = parseFloat(z);
    if (!isFinite(n)) return null;
    if (n > 10) return n / 100;
    return n / 10;
  }

  function parseOneOffer(text, shelf) {
    var t = String(text || "").trim();
    if (!t || shelf == null || !isFinite(shelf)) return null;
    var best = null;
    function consider(unit, qty, note) {
      if (unit == null || !isFinite(unit) || unit <= 0) return;
      if (!best || unit < best.unit) best = { unit: unit, qty: qty || 1, note: note || t };
    }
    var parts = t.split(/\s*\/\s*/);
    if (parts.length > 1) {
      for (var i = 0; i < parts.length; i++) {
        var sub = parseOneOffer(parts[i], shelf);
        if (sub) consider(sub.unit, sub.qty, sub.note);
      }
      return best;
    }
    var m;
    m = t.match(/買\s*(\d+)\s*件(?:只需)?\s*\$?\s*(\d+(?:\.\d+)?)/);
    if (m) { consider(parseFloat(m[2]) / parseInt(m[1], 10), parseInt(m[1], 10), t); return best; }
    m = t.match(/^(\d+)\s*件\s*\$?\s*(\d+(?:\.\d+)?)/);
    if (m) { consider(parseFloat(m[2]) / parseInt(m[1], 10), parseInt(m[1], 10), t); return best; }
    m = t.match(/\$\s*(\d+(?:\.\d+)?)\s*任揀\s*(\d+)\s*件/);
    if (m) { consider(parseFloat(m[1]) / parseInt(m[2], 10), parseInt(m[2], 10), t); return best; }
    m = t.match(/買\s*(\d+)\s*件慳\s*\$?\s*(\d+(?:\.\d+)?)/);
    if (m) {
      var n0 = parseInt(m[1], 10), save = parseFloat(m[2]);
      consider((n0 * shelf - save) / n0, n0, t);
      return best;
    }
    m = t.match(/買\s*(\d+)\s*(?:件)?\s*送\s*(\d+)\s*(?:件)?/);
    if (m) {
      var a = parseInt(m[1], 10), b = parseInt(m[2], 10);
      consider((a * shelf) / (a + b), a + b, t);
      return best;
    }
    if (/第\s*二?\s*2?\s*件半價|第二件\s*50\s*%|第2件半價/.test(t)) {
      consider((shelf + shelf * 0.5) / 2, 2, t);
      return best;
    }
    m = t.match(/買第2件\s*\$?\s*(\d+(?:\.\d+)?)/);
    if (m) { consider((shelf + parseFloat(m[1])) / 2, 2, t); return best; }
    m = t.match(/買\s*(\d+)\s*件(?:或以上)?\s*(\d+(?:\.\d+)?)\s*折/);
    if (m) {
      var f = zheToFactor(m[2]);
      if (f) consider(shelf * f, parseInt(m[1], 10), t);
      return best;
    }
    m = t.match(/(\d+)\s*件\s*(\d+(?:\.\d+)?)\s*折/);
    if (m) {

  function enrichPrices(rawPrices, offerMap) {
    return (rawPrices || []).map(function (x) {
      var off = offerMap[x.s] || "";
      var parsed = off ? parseOneOffer(off, x.v) : null;
      var promo = !!(parsed && parsed.unit < x.v - 0.0001);
      return {
        s: x.s,
        v: x.v,
        offer: off,
        eff: promo ? parsed.unit : x.v,
        promo: promo,
        qty: promo ? parsed.qty : 1,
        promoNote: promo ? parsed.note : ""
      };
    });
  }

  function filteredPrices(p, stores) {
    var want = {};
    stores.forEach(function (s) { want[s] = 1; });
    var raw = (p.p || []).filter(function (x) { return want[x.s]; });
    return enrichPrices(raw, offersMap(p));

    if (!prices.length) return { min: null, max: null, gap: 0 };

      var v = prices[i].eff;
      if (v < min) min = v;
      if (v > max) max = v;
    }
    return { min: min, max: max, gap: max - min };
  }

    for (var i = 0; i < list.length; i++) {
      var t = list[i];
      if (name.indexOf(t) !== -1) score += 5;
      if (c3.indexOf(t) !== -1) score += 4;
      if (c2.indexOf(t) !== -1) score += 2;
    }
    if (name.indexOf("濕") !== -1 && (raw.indexOf("濕") === -1)) score -= 3;
    return score;
  }

  function filterAll() {
    var q = state.q.trim().toLowerCase();
    var rawQ = state.q.trim();
    var terms = q ? expandQuery(rawQ) : [];
    if (q && !terms.length) terms = [q];
    var stores = activeStoreCodes();
    var out = [];
    for (var i = 0; i < data.length; i++) {
      var p = data[i];
      if (state.cat && p.c1 !== state.cat) continue;
      if (!matchQuery(p, q, terms, rawQ)) continue;
      var prices = filteredPrices(p, stores);
      if (!prices.length) continue;
      var st = stats(prices);
      out.push({ p: p, prices: prices, st: st, offers: offersMap(p) });
    }
    out.forEach(function (row) { row.rel = relevanceScore(row.p, q, terms, rawQ); });
    if (state.sort === "cheap") {
      out.sort(function (a, b) {
        var r = b.rel - a.rel;
        if (r) return r;
        var d = (a.st.min == null ? 1e12 : a.st.min) - (b.st.min == null ? 1e12 : b.st.min);
        if (d) return d;
        return (a.p.n || "").localeCompare(b.p.n || "", "zh-Hant");
      });
    } else if (state.sort === "gap") {
      out.sort(function (a, b) {
        var r = b.rel - a.rel;
        if (r) return r;
        var d = b.st.gap - a.st.gap;
        if (d) return d;
        return (a.p.n || "").localeCompare(b.p.n || "", "zh-Hant");
      });
    } else {
      out.sort(function (a, b) {
        var r = b.rel - a.rel;
        if (r) return r;
        return ((a.p.b || "") + a.p.n).localeCompare((b.p.b || "") + b.p.n, "zh-Hant");
      });
    }
    return out;
  }

  function escapeHtml(s) {
    // Split entity names so HTML re-serializers cannot turn this into broken JS
    // (a prior bug decoded " → " and left .replace(/"/g, """); which killed the whole app script).
    return String(s == null ? "" : s)
      .replace(/&/g, "&" + "amp;")
      .replace(/</g, "&" + "lt;")
      .replace(/>/g, "&" + "gt;")
      .replace(/"/g, "&" + "quot;");
  }
  function escapeAttr(s) { return escapeHtml(s); }

  function updateHktv() {
    var kw = state.q.trim() || "牛奶";
    var url = "https://www.hktvmall.com/hktv/zh/search_a?keyword=" + encodeURIComponent(kw);
    el.hktvBtn.href = url;
    el.hktvBtn.textContent = "喺 HKTVmall 搜「" + kw + "」對價";
  }

  function renderTips(cats) {
    var tips = ["廁紙", "面紙", "洗頭水", "尿片", "公仔麵", "洗衣液", "鮮奶", "廚房紙"];
    var html = "<strong>未搜尋時可以咁試：</strong>輸入品牌或貨品名。常見例子：";
    html += '<div class="tip-tags">';
    tips.forEach(function (t) {
      html += '<button type="button" data-tip="' + escapeAttr(t) + '">' + escapeHtml(t) + "</button>";
    });
    html += "</div>";
    html += '<div style="margin-top:12px;font-size:.85rem">或撳大類快速篩選：</div><div class="cat-quick">';
    cats.slice(0, 8).forEach(function (c) {
      var short = c.split(" / ")[0];
      html += '<button type="button" data-cat="' + escapeAttr(c) + '">' + escapeHtml(short) + "</button>";
    });
    html += "</div>";
    el.tips.innerHTML = html;
  }


  var THUMB_TONES = 8;
  var CAT_EMOJI = {
    "麵包": "🍞", "方包": "🍞", "蛋糕": "🍰", "穀類": "🥣",
    "牛奶": "🥛", "乳製品": "🧀", "乳酪": "🧀", "芝士": "🧀",
    "雞蛋": "🥚", "肉": "🥩", "魚": "🐟", "海鮮": "🦐",
    "蔬菜": "🥬", "水果": "🍎", "米": "🍚", "麵": "🍜", "即食麵": "🍜",
    "油": "🫒", "醬": "🧂", "調味": "🧂", "糖": "🍬",
    "茶": "🍵", "咖啡": "☕", "飲料": "🥤", "水": "💧", "果汁": "🧃",
    "酒": "🍺", "啤酒": "🍺",
    "廁紙": "🧻", "衛生紙": "🧻", "面紙": "🤧", "紙巾": "🤧", "濕紙巾": "💧",
    "洗衣": "🧺", "清潔": "🧹", "洗髮": "🧴", "沐浴": "🛁", "護膚": "✨",
    "牙膏": "😁", "牙刷": "😁", "紙尿褲": "👶", "尿片": "👶",
    "寵物": "🐾", "貓": "🐱", "狗": "🐶",
    "零食": "🍪", "餅乾": "🍪", "朱古力": "🍫", "薯片": "🥔",
    "急凍": "🧊", "雪糕": "🍦", "冰淇淋": "🍦"
  };

  function hashTone(str) {
    var s = String(str || "");
    var h = 0;
    for (var i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
    return Math.abs(h) % THUMB_TONES;
  }

  function thumbLetter(brand, name) {
    var src = (brand && String(brand).trim()) || (name && String(name).trim()) || "?";
    // Prefer first CJK / letter / digit character
    var m = src.match(/[\u4e00-\u9fffA-Za-z0-9]/);
    var ch = m ? m[0] : src.charAt(0);
    return ch.toUpperCase();
  }

  function catEmoji(c2, c3) {
    var keys = [c3, c2].filter(Boolean);
    for (var i = 0; i < keys.length; i++) {
      var k = String(keys[i]);
      if (CAT_EMOJI[k]) return CAT_EMOJI[k];
      for (var label in CAT_EMOJI) {
        if (k.indexOf(label) !== -1) return CAT_EMOJI[label];
      }
    }
    return "";
  }

  function hktvSearchUrl(brand, name) {
    var kw = ((brand || "") + " " + (name || "")).trim();
    return "https://www.hktvmall.com/hktv/zh/search_a?keyword=" + encodeURIComponent(kw);
  }

  function renderCard(item) {
    var p = item.p;
    var prices = item.prices.slice().sort(function (a, b) {
      return ALL_STORE_ORDER.indexOf(a.s) - ALL_STORE_ORDER.indexOf(b.s);
    });
    var min = item.st.min;
    var open = state.openId === p.c;
    var gapHtml = "";
    if (prices.length > 1 && item.st.gap > 0.009) {
      gapHtml = '<span class="save-badge">慳 ' + money(item.st.gap) + "/件</span>";
    }
    var hktvUrl = hktvSearchUrl(p.b, p.n);
    var tone = hashTone(p.b || p.n || p.c);
    var letter = escapeHtml(thumbLetter(p.b, p.n));
    var emoji = catEmoji(p.c2, p.c3);
    var catLabel = escapeHtml((p.c3 || p.c2 || "").toString());
    var thumbTitle = escapeAttr([p.c2, p.c3].filter(Boolean).join(" ／ ") || (p.n || ""));
    var html = '<article class="card' + (open ? " open" : "") + '" data-id="' + escapeAttr(p.c) + '" tabindex="0" role="button" aria-expanded="' + (open ? "true" : "false") + '">';
    html += '<div class="card-row">';
    html += '<a class="thumb thumb-t' + tone + '" href="' + escapeAttr(hktvUrl) + '" target="_blank" rel="noopener noreferrer" title="' + thumbTitle + '" aria-label="喺 HKTVmall 睇相">';
    html += '<span class="thumb-letter">' + letter + '</span>';
    if (emoji) {
      html += '<span class="thumb-cat" aria-hidden="true">' + emoji + '</span>';
    } else if (catLabel) {
      html += '<span class="thumb-cat">' + catLabel + '</span>';
    }
    html += "</a>";
    html += '<div class="card-main">';
    html += '<div class="card-top"><div><div class="brand">' + escapeHtml(p.b || "—") + "</div>";
    html += '<div class="name"><a class="name-link" href="' + escapeAttr(hktvUrl) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(p.n || "") + "</a></div></div>" + gapHtml + "</div>";
    html += '<div class="card-actions"><a class="see-photo" href="' + escapeAttr(hktvUrl) + '" target="_blank" rel="noopener noreferrer">📷 睇相</a></div>';
    html += '<div class="prices">';
    prices.forEach(function (pr) {
      var best = Math.abs(pr.eff - min) < 0.0001;
      html += '<div class="price-cell' + (best ? " best" : "") + '">';
      html += '<div class="store">' + escapeHtml(zhStore(pr.s)) + "</div>";
      if (pr.promo) {
        html += '<div class="val">' + money(pr.eff) + '<span class="per">/件</span></div>';
        html += '<div class="offer">標價 ' + money(pr.v) + " · " + escapeHtml(pr.offer) + "</div>";
      } else {
        html += '<div class="val">' + money(pr.v) + "</div>";
        if (pr.offer) html += '<div class="offer">' + escapeHtml(pr.offer) + "</div>";
      }
      html += "</div>";
    });
    html += "</div>";
    html += '<div class="details">';
    html += "<div>大類：" + escapeHtml(p.c1 || "—") + (p.c2 ? " ／ " + escapeHtml(p.c2) : "") + (p.c3 ? " ／ " + escapeHtml(p.c3) : "") + "</div>";
    html += "<div>貨品編號：" + escapeHtml(p.c) + "</div>";
    html += "<div style=\"margin:6px 0;color:var(--muted);font-size:.82rem\">「最平」按優惠估算每件實付（需買齊優惠件數）；未能自動計嘅優惠只顯示原文。消委會數據無商品相，可撳「睇相」去 HKTVmall 睇真相。</div>";
    html += "<table><thead><tr><th>超市</th><th>標價</th><th>估算/件</th><th>優惠</th></tr></thead><tbody>";
    prices.slice().sort(function (a, b) { return a.eff - b.eff; }).forEach(function (pr) {
      var best = Math.abs(pr.eff - min) < 0.0001;
      html += "<tr><td>" + escapeHtml(zhStore(pr.s)) + '</td><td class="num">' + money(pr.v) +
        '</td><td class="num' + (best ? " best" : "") + '">' + money(pr.eff) +
        (best ? " · 最平" : "") + (pr.promo ? "（買" + pr.qty + "）" : "") +
        "</td><td>" + escapeHtml(pr.offer || "—") + "</td></tr>";
    });
    html += "</tbody></table></div></div></div></article>";
    return html;
  }

  function render() {
    updateHktv();
    var showTips = !state.q.trim() && !state.cat;
    el.tips.hidden = !showTips;
    if (showTips) {
      // Skip full-catalog scan/sort until the user searches or picks a category
      el.list.innerHTML = "";
      el.moreWrap.hidden = true;
      el.resultMeta.textContent = "共 " + data.length.toLocaleString("zh-HK") + " 件貨品 · 輸入關鍵字開始格價";
      return;
    }

    var rows = filterAll();
    var total = rows.length;
    var slice = rows.slice(0, state.limit);
    if (!slice.length) {
      el.list.innerHTML = '<div class="empty">搵唔到符合條件嘅貨品。<br>試吓改關鍵字、大類或超市篩選。</div>';
      el.moreWrap.hidden = true;
      el.resultMeta.textContent = "0 件結果";
      return;
    }

    el.list.innerHTML = slice.map(renderCard).join("");
    el.moreWrap.hidden = total <= state.limit;
    el.moreBtn.textContent = "顯示更多（已顯示 " + slice.length + " / " + total + "）";
    el.resultMeta.textContent = "顯示 " + slice.length + " / " + total + " 件";
  }

  // events
  el.q.addEventListener("input", debounce(function () {
    state.q = el.q.value;
    state.limit = PAGE;
    render();
  }, 150));

  el.cat.addEventListener("change", function () {
    state.cat = el.cat.value;
    state.limit = PAGE;
    render();
  });

  el.sort.addEventListener("change", function () {
    state.sort = el.sort.value;
    render();
  });

  el.chips.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-store]");
    if (!btn) return;
    var code = btn.getAttribute("data-store");
    selectedStores[code] = !selectedStores[code];
    // keep at least one
    if (!activeStoreCodes().length) {
      selectedStores[code] = true;
      return;
    }
    btn.setAttribute("aria-pressed", selectedStores[code] ? "true" : "false");
    state.limit = PAGE;
    render();
  });

  el.list.addEventListener("click", function (e) {
    if (e.target.closest("a")) return; // thumb / 睇相 / name → open HKTVmall, don't toggle
    var card = e.target.closest(".card");
    if (!card) return;
    var id = card.getAttribute("data-id");
    state.openId = state.openId === id ? null : id;
    render();
  });

  el.list.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var card = e.target.closest(".card");
    if (!card) return;
    e.preventDefault();
    card.click();
  });

  el.tips.addEventListener("click", function (e) {
    var tip = e.target.closest("[data-tip]");
    if (tip) {
      el.q.value = tip.getAttribute("data-tip");
      state.q = el.q.value;
      state.limit = PAGE;
      render();
      el.q.focus();
      return;
    }
    var catBtn = e.target.closest("[data-cat]");
    if (catBtn) {
      el.cat.value = catBtn.getAttribute("data-cat");
      state.cat = el.cat.value;
      state.limit = PAGE;
      render();
    }
  });

  el.moreBtn.addEventListener("click", function () {
    state.limit += PAGE;
    render();
  });

  window.addEventListener("scroll", function () {
    el.sticky.classList.toggle("scrolled", window.scrollY > 8);
  }, { passive: true });

  // init
  var cats = buildCats();
  buildChips();
  renderTips(cats);
  var stamp = meta.updated ? ("數據快照：" + meta.updated + "（香港時間）") : "";
  el.dataStamp.textContent = stamp;
  el.footerStamp.textContent = stamp + (meta.count ? (" · 共 " + meta.count + " 件") : "") + " · 本機／網頁離線可用（價錢數據已嵌入）。";
  render();
})();
  </script>
</body>
</html>
